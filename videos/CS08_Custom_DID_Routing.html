<meta charset="UTF-8">
<title>CS08 · Custom Inbound Routing on Direct Phone Numbers · Animated SOP</title>
<link rel="stylesheet" href="../lib/video.css">
<script type="application/json" id="speaker-notes">
[
  "Route a user's number into the queue. CS08 fixes a specific asymmetry in the phone system — callers dialing the main switchboard go through the queue, but callers dialing an agent's direct line skip the queue and ring only that one person. One rule, one condition, one action collapses the two paths.",
  "Two paths. Without this rule, callers dialing the main number reach the queue and everyone rings. Callers dialing an agent's direct line skip the queue entirely. That asymmetry — same person, different experience depending on which number was dialed — is what CS08 solves.",
  "Three terms. User. Custom rule. DID — Direct Inward Dial, the agent's individual phone number. All three appear in every step of this SOP.",
  "Two existing redirects as of last review. Established March 22, 2026 to collapse the two-pathway architecture for the office. Both route calls to specific staff direct lines into Q1.",
  "The fix. One condition plus one action. Both required. Without the condition the rule catches every call to the user — almost never what you want. With the condition, only calls dialed to the agent's direct number trigger the redirect into the queue.",
  "Destination — 160001. Not the queue's own phone number. RingCentral rejects forwarding rules that target a phone number on the same account. The destination is the queue's extension, not its public DID.",
  "Setting up a new redirect. Five steps. Naming convention is 'Route Inbound to Switchboard.' Use the same name pattern every time so administrators can recognize and audit the rules at a glance.",
  "Test from two phones. Both paths matter. Call the agent's direct number — verify it lands in the queue and rings the team. Call the main switchboard — verify normal queue behavior is unchanged.",
  "Disable or delete. Disable first when in doubt. The rule is preserved but inactive. If the agent moves teams or roles change, disable while you reassess. Delete only when you're sure the rule won't be needed.",
  "Authorization. These rules change where calls to a public number land — they can confuse callers if applied without coordination. Notify the agent, the queue manager, and IT before saving.",
  "Log every change. Same fields as every other RingCentral change. Date and time. Rule name. Condition. Action. Approver. Reason.",
  "Quiz one. Forwarding calls from an agent's direct number into Q1. The destination is the queue extension — 160001 — not the queue's public DID. Same-account public numbers are rejected by RingCentral.",
  "Quiz two. The condition that turns a generic user rule into a direct-number redirect is Called Number. That's the condition that says 'only when this user's DID is dialed.'",
  "One rule. One condition. One action. Established at our office for Diana Martinez and Melissa Vigil — both route directly to Q1. The pattern works for any switchboard agent. Count on us."
]
</script>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
// This SOP has no screenshots captured yet at the Assessor's Office.
// The video uses diagrammatic scenes only, per the SOP\'s own note.

const scenes = [
  {
    kind: 'title',
    es: { "title":"Enrutar el Número de un Usuario a la Cola","plainTitle":"Cómo redirigir las llamadas marcadas al número directo de un agente del conmutador a la cola del conmutador misma — para que las llamadas se distribuyan en lugar de sonar en un solo teléfono.","kicker":"Cada redirección de número directo requiere autorización del Subtasador." },
    duration: 8,
    sopId: 'CS08',
    title: 'Route a User\'s Number into the Queue',
    plainTitle: 'How to redirect calls dialed to a switchboard agent\'s direct number into the switchboard queue itself — so calls get distributed instead of ringing one phone.',
    kicker: 'Every direct-number redirect requires Deputy Assessor authorization.',
  },

  // The problem
  {
    kind: 'bigstat',
    es: { "stat":"Dos rutas","caption":"El problema que estamos resolviendo","sub":"Sin esta regla, las llamadas al número principal entran a la cola (todos suenan), pero las llamadas al número directo de un agente saltan la cola y suenan solo a esa persona. Esa asimetría aumentó la tasa de fallas de marcación directa." },
    duration: 13,
    stat: 'Two paths',
    caption: 'The problem we\'re solving',
    sub: 'Without this rule, callers dialing the main number hit the queue (everyone rings), but callers dialing an agent\'s direct line skip the queue and ring only that one person. That asymmetry pushed the direct-dial failure rate up.',
  },

  // Two terms
  {
    kind: 'steps',
    es: { "title":"Tres términos antes de empezar","sub":"Aparecen en cada paso.","steps":[{"label":"DID (Marcación Directa)","desc":"Un número telefónico directo asignado a un usuario o extensión individual."},{"label":"Regla entrante personalizada","desc":"Una anulación condicional en una extensión de usuario que redirige las llamadas coincidentes a un destino diferente. Mismos tipos de condición y acción que las reglas a nivel de cola en CS05."},{"label":"Route Inbound to Switchboard","desc":"El patrón estándar de nomenclatura en nuestra oficina para estas redirecciones."}] },
    duration: 15,
    title: 'Three terms before we start',
    sub: 'These appear in every step.',
    steps: [
      { label: 'DID (Direct Inward Dial)', desc: 'A direct phone number assigned to an individual user or extension.' },
      { label: 'Custom inbound rule', desc: 'A condition-based override on a user extension that redirects matching calls to a different destination. Same condition + action types as queue-level rules in CS05.' },
      { label: 'Route Inbound to Switchboard', desc: 'The standard naming pattern at our office for these redirects.' },
    ],
  },

  // Reference patterns
  {
    kind: 'comparison',
    es: { "title":"Dos redirecciones existentes (al último repaso)","sub":"Establecidas el 22/03/2026 para colapsar la arquitectura de dos rutas.","items":[{"tag":"Agente conmutador","label":"Diana Y Martinez","desc":"Ext 163722. Número directo 505-222-3722. La regla personalizada \"Route Inbound to Switchboard\" redirige las llamadas entrantes a Q1 (160001)."},{"tag":"Agente conmutador","label":"Melissa Vigil","desc":"Ext 169005. Número directo 505-468-7243. La regla personalizada \"Route Inbound to Switchboard\" redirige las llamadas entrantes a Q1 (160001)."}] },
    duration: 15,
    title: 'Two existing redirects (as of last review)',
    sub: 'Established 03/22/2026 to collapse the two-pathway architecture.',
    items: [
      { tag: 'Switchboard agent', label: 'Diana Y Martinez', accent: SOP_PALETTE.bosque, desc: 'Ext 163722. Direct number 505-222-3722. Custom rule "Route Inbound to Switchboard" redirects inbound calls to Q1 (160001).' },
      { tag: 'Switchboard agent', label: 'Melissa Vigil', accent: SOP_PALETTE.terracotta, desc: 'Ext 169005. Direct number 505-468-7243. Custom rule "Route Inbound to Switchboard" redirects inbound calls to Q1 (160001).' },
    ],
  },

  // The fix: condition + action
  {
    kind: 'comparison',
    es: { "title":"La solución: una condición + una acción","sub":"Ambas requeridas. Sin la condición, la regla atrapa cada llamada al usuario — casi nunca lo que quiere.","items":[{"tag":"Condición","label":"Called Number","desc":"Coincide solo cuando quien llama marcó el número directo DE ESTE usuario. Sin ella, también coinciden las llamadas internas y de cola."},{"tag":"Acción","label":"Forward to extension","desc":"Envía la llamada coincidente al número de extensión de la cola (ej. 160001 para Q1). NUNCA al número telefónico de la cola — vea la siguiente escena."}] },
    duration: 18,
    title: 'The fix: one condition + one action',
    sub: 'Both required. Without the condition, the rule catches every call to the user — almost never what you want.',
    items: [
      { tag: 'Condition', label: 'Called Number', accent: SOP_PALETTE.bosque, desc: 'Match only when the caller dialed THIS user\'s direct number. Without it, internal calls and queue calls also match.' },
      { tag: 'Action', label: 'Forward to extension', accent: SOP_PALETTE.terracotta, desc: 'Send the matching call to the queue\'s extension number (e.g. 160001 for Q1). NEVER the queue\'s phone number — see the next scene.' },
    ],
  },

  // Critical: use extension not phone
  {
    kind: 'bigstat',
    es: { "stat":"160001","caption":"Reenviar a la EXTENSIÓN","sub":"NO al número telefónico de la cola. RingCentral rechaza las reglas de reenvío que apuntan a un número telefónico ya en la cuenta, con el error \"Forwarding phone number cannot be the same as your account number or any additional numbers.\" Es comportamiento documentado, no un bug." },
    duration: 13,
    stat: '160001',
    caption: 'Forward to the EXTENSION',
    sub: 'NOT the queue\'s phone number. RingCentral rejects forwarding rules that target a phone number already on the account, with the error "Forwarding phone number cannot be the same as your account number or any additional numbers." This is documented behavior, not a bug.',
    accent: SOP_PALETTE.terracotta,
  },

  // Setting it up
  {
    kind: 'steps',
    es: { "title":"Configurar una nueva redirección","sub":"Cinco pasos. Nombre estándar es \"Route Inbound to Switchboard\".","steps":[{"label":"Abra el usuario","desc":"Users → Users with Extensions → busque por nombre o extensión → haga clic en el usuario."},{"label":"Call Handling → Custom rules","desc":"Algunas versiones del portal lo etiquetan \"Call Handling & Forwarding\" o \"Incoming Call Rules\" — es lo mismo. Haga clic en + Add Rule. Nómbrelo \"Route Inbound to Switchboard\". Haga clic en Next."},{"label":"Configure la condición Called Number","desc":"Seleccione Called Number como el tipo de condición. Elija el número directo del usuario del menú (ej. 505-222-3722). Deje Caller ID sin configurar. No agregue Date/Time a menos que la redirección deba tener un límite de tiempo."},{"label":"Configure Forward to extension","desc":"Seleccione Forward calls como la acción. Elija \"extension on the account\". Seleccione el número completo de extensión de la cola (ej. 160001 para Q1)."},{"label":"Haga clic en Save","desc":"La regla está ahora activa."}] },
    duration: 20,
    title: 'Setting up a new redirect',
    sub: 'Five steps. Naming convention is "Route Inbound to Switchboard".',
    steps: [
      { label: 'Open the user', desc: 'Users → Users with Extensions → search by name or extension → click the user.' },
      { label: 'Call Handling → Custom rules', desc: 'Some portal versions label this "Call Handling & Forwarding" or "Incoming Call Rules" — same thing. Click + Add Rule. Name it "Route Inbound to Switchboard". Click Next.' },
      { label: 'Configure the Called Number condition', desc: 'Select Called Number as the condition type. Pick the user\'s direct number from the dropdown (e.g. 505-222-3722). Leave Caller ID unset. Don\'t add a Date/Time unless the redirect should be time-bounded.' },
      { label: 'Configure Forward to extension', desc: 'Select Forward calls as the action. Choose "extension on the account". Select the queue\'s full extension number (e.g. 160001 for Q1).' },
      { label: 'Click Save', desc: 'The rule is now active.' },
    ],
  },

  // Verify from two phones
  {
    kind: 'comparison',
    es: { "title":"Pruebe desde dos teléfonos","sub":"Ambas rutas importan. Verifique las dos.","items":[{"tag":"Externa","label":"Línea externa","desc":"Marque el número directo del usuario desde una línea externa. La llamada debe sonar a la cola (todos) — no solo al usuario. En el registro de llamadas de la cola, el número marcado debe aparecer como el número directo del usuario y el destino enrutado como la extensión de la cola."},{"tag":"Interna","label":"Marcación de extensión","desc":"Marque la extensión del usuario internamente. La llamada DEBE seguir sonando al usuario directamente. Las marcaciones internas no coinciden con la condición Called Number."}] },
    duration: 15,
    title: 'Test from two phones',
    sub: 'Both paths matter. Verify both.',
    items: [
      { tag: 'External', label: 'Outside line', accent: SOP_PALETTE.bosque, desc: 'Dial the user\'s direct number from an outside line. The call should ring into the queue (everyone) — not just the user. In the queue\'s call log, the dialed number should appear as the user\'s direct number and the routed destination as the queue extension.' },
      { tag: 'Internal', label: 'Extension dial', accent: SOP_PALETTE.terracotta, desc: 'Dial the user\'s extension internally. The call should STILL ring the user directly. Internal dials don\'t match the Called Number condition.' },
    ],
  },

  // Disable or remove
  {
    kind: 'comparison',
    es: { "title":"Deshabilitar o eliminar","sub":"Deshabilite primero cuando esté en duda — se preserva pero inactiva.","items":[{"tag":"Reversible","label":"Deshabilitar","desc":"En la lista Custom rules del usuario, ubique la regla. Apague el interruptor Active. Guarde. La regla se preserva pero ya no aplica — las llamadas al número directo ahora se enrutan al usuario por defecto."},{"tag":"Permanente","label":"Eliminar","desc":"Haga clic en Delete junto a la regla. Confirme. La regla se elimina permanentemente. Haga una llamada de prueba al número directo del usuario y confirme que ahora llega al usuario (no a la cola)."}] },
    duration: 15,
    title: 'Disable or delete',
    sub: 'Disable first when in doubt — preserved but inactive.',
    items: [
      { tag: 'Reversible', label: 'Disable', accent: SOP_PALETTE.bosque, desc: 'In the user\'s Custom rules list, locate the rule. Toggle the Active switch OFF. Save. The rule is preserved but no longer applies — calls to the direct number now route to the user per their default call handling.' },
      { tag: 'Permanent', label: 'Delete', accent: SOP_PALETTE.terracotta, desc: 'Click Delete next to the rule. Confirm. The rule is removed permanently. Place a test call to the user\'s direct number and confirm it now reaches the user (not the queue).' },
    ],
  },

  // Authorization
  {
    kind: 'steps',
    es: { "title":"Autorización","sub":"Estas reglas cambian dónde aterrizan las llamadas a un número público — pueden confundir a los que llaman si se aplican sin coordinación.","steps":[{"label":"Agregar / editar / quitar una regla de redirección","desc":"Subtasador a cargo del Servicio al Cliente."},{"label":"Deshabilitar una regla activa (temporal)","desc":"Subtasador O Gerente de Servicio al Cliente con notificación al Subtasador."}] },
    duration: 13,
    title: 'Authorization',
    sub: 'These rules change where calls to a public number land — they can confuse callers if applied without coordination.',
    steps: [
      { label: 'Add / edit / remove a redirect rule', desc: 'Deputy Assessor overseeing Customer Service.' },
      { label: 'Disable an active rule (temporary)', desc: 'Deputy Assessor OR Customer Service Manager with Deputy Assessor notification.' },
    ],
  },

  // Change control
  {
    kind: 'steps',
    es: { "title":"Registre cada cambio","sub":"Mismos campos que cualquier otro cambio de RingCentral.","steps":[{"label":"Captura previa al cambio","desc":"Capture la pestaña Custom rules del usuario antes de editar."},{"label":"Aplique, guarde, verifique","desc":"Use el procedimiento anterior. Haga clic en Save. Pruebe desde una línea externa."},{"label":"Regístrelo","desc":"Fecha/hora, usuario/extensión, ajuste cambiado, valor anterior, valor nuevo, autorizador, aplicador, motivo de negocio, resultado de verificación."}] },
    duration: 14,
    title: 'Log every change',
    sub: 'Same fields as every other RingCentral change.',
    steps: [
      { label: 'Pre-change snapshot', desc: 'Screenshot the user\'s Custom rules tab before editing.' },
      { label: 'Apply, save, verify', desc: 'Use the procedure above. Click Save. Test from an outside line.' },
      { label: 'Log it', desc: 'Date/time, user/extension, setting changed, prior value, new value, authorizer, applier, business reason, verification result.' },
    ],
  },

  // Quiz
  {
    kind: 'quiz',
    es: { "title":"Una regla. Una condición. Una acción.","sub":"Establecida en nuestra oficina para Diana Martinez y Melissa Vigil — ambas enrutan directamente a Q1. El patrón funciona para cualquier agente del conmutador." }, duration: 17,
    qNum: 1, qTotal: 2,
    question: 'You\'re forwarding calls from an agent\'s direct number into Q1. What do you select as the destination?',
    options: [
      'The queue\'s phone number',
      'The queue\'s full extension number, e.g. 160001',
      'The queue manager\'s email',
      'The auto-receptionist',
    ],
    correctIndex: 1,
    explanation: 'Always the EXTENSION. RingCentral rejects forwarding to a phone number already on the account.',
  },
  {
    kind: 'quiz',
    es: { "question":"Está reenviando llamadas desde el número directo de un agente a Q1. ¿Qué selecciona como destino?","options":["El número telefónico de la cola","El número completo de extensión de la cola, ej. 160001","El correo electrónico del gerente de cola","El auto-receptionist"],"explanation":"Siempre la EXTENSIÓN. RingCentral rechaza el reenvío a un número telefónico ya en la cuenta." }, duration: 17,
    qNum: 2, qTotal: 2,
    question: 'Which condition turns a generic user-level custom rule into a direct-number redirect?',
    options: [
      'Date and/or Time',
      'Caller ID',
      'Called Number',
      'No condition needed — actions alone are enough',
    ],
    correctIndex: 2,
    explanation: 'Called Number scopes the rule to fire only when the caller dialed THIS user\'s direct number. Without it, internal calls and queue calls also match.',
  },

  {
    kind: 'outro',
    es: { "question":"¿Qué condición convierte una regla genérica a nivel de usuario en una redirección de número directo?","options":["Date and/or Time","Caller ID","Called Number","Ninguna condición necesaria — la acción es suficiente"],"explanation":"Called Number limita la regla a dispararse solo cuando el llamante marcó el número directo DE ESTE usuario. Sin ella, también coinciden las llamadas internas y de cola." },
    duration: 10,
    title: 'One rule. One condition. One action.',
    sub: 'Established at our office for Diana Martinez and Melissa Vigil — both route directly to Q1. The pattern works for any switchboard agent.',
  },
];

ReactDOM.createRoot(document.getElementById('root')).render(
  <SOPVideo sopId="CS08" title="Custom Inbound Routing on Direct Phone Numbers" scenes={scenes} />
);
</script>
