<title>AIO07 · Records Retention &amp; IPRA Response · Animated SOP</title>
<link rel="stylesheet" href="../lib/video.css">
<script type="application/json" id="speaker-notes">
[
  "Welcome. This SOP is about what happens to A.C.E.'s records after they're produced. The operational SOPs — AIO01 through AIO06, BIO01, BIO04 — tell you how to run the agents. AIO07 tells you how to retain what they produce, and how to respond when someone files an Inspection of Public Records Act request. Two parts. Part A is ongoing. Part B is a clock.",
  "The whole reason AIO07 exists is the clock. Three business days to acknowledge. Fifteen calendar days to produce or deny. And — this is the one people forget — the clock starts the moment the records custodian receives the request, not the moment it lands in your inbox as the AI Project Lead. If the custodian got it on Thursday and you see it Monday, you have already burned almost a week.",
  "Two parts, two rhythms. Part A runs all the time, whether or not anyone's asked for anything. It keeps the inventory current, the archive fresh, and the LGRRDS mapping documented. Part B only runs when an actual IPRA request lands. Part A is what makes Part B possible — if you don't have an inventory and an archive, you can't answer a request in 15 days.",
  "Part A. Five disciplines. They sound boring but they are the entire substance of records management. Get these right and Part B becomes a search-and-retrieve exercise. Get them wrong and Part B becomes a fire drill.",
  "The inventory has nine categories grouped into four buckets. Public chatbot logs and internal BIO agent logs. Phone — that's Bland AI recordings and transcripts. Email — Power Automate. Then the configuration side: persona files, Actions, KB documents, telemetry, and the change logs from AIO03 and BIO01. If any record category isn't on this list, it might as well not exist when a request comes in.",
  "Custody is not the same as hosting. CustomGPT.ai stores the chatbot conversations. Bland AI stores the call recordings. Power Automate stores the email logs. But the Bernalillo County Assessor's Office is the legal custodian. We are responsible for producing those records, redacting them, and retaining them, regardless of which vendor's servers they sit on.",
  "Two cadences for the office-controlled archive. Monthly — pull conversation logs and telemetry to the office records share. On change — every persona edit, every config tweak, every KB document update gets snapshotted. The good news is the change SOPs, AIO03 and BIO01, already trigger this. The goal is simple: if a vendor disappeared tomorrow, the office should still be able to answer a records request from its own holdings.",
  "Two decisions you don't make alone. A.4 — sit with the records custodian and map every record category to the closest LGRRDS series. There is no dedicated series for A.C.E. records yet, so this is a custodian decision that gets documented, not a guess. And never destroy a record without an approved disposition. A.5 — read your vendor contracts. CustomGPT, Bland, any automation platform. Confirm they let us retrieve our data on demand and address what happens if they shut down. Any gap goes straight to the Deputy.",
  "Part B. The on-clock side. Eight steps, two clocks, and one rule that has no wiggle room: a human reviews and attests to every redaction before anything leaves the building. Not the AI. A person.",
  "B.1 and B.2. Log receipt — capture the exact timestamp the custodian got it, the requester's contact, and the scope as written. Verbatim, do not paraphrase. Then acknowledge in writing within three business days. If you can't produce the records that fast, say so in writing and tell them when you will respond. That's Section 14-2-8.D.",
  "B.3. Search the inventory categories you set up in Part A. Conversation logs, persona files, configuration, knowledge-base content — anything in the inventory could be responsive depending on how the request reads. Pull from the office-controlled archive first. Go to the vendor only if you have to.",
  "B.4. Is the request burdensome? 'All A.C.E. conversations ever' against tens of thousands of queries — yes, that's burdensome. A single named parcel or a specific date range — no, that's normal. Section 14-2-10 lets us send written notice within 15 days that we need reasonable additional time, with a good-faith production plan. Use it when warranted. Do not use it just to slow down requests you don't like.",
  "B.5 is the most important step in the entire SOP. Inside any single record, separate the exempt material from the non-exempt material. Release the non-exempt part. Redact the rest — protected personal identifier information under 14-2-6(F), anything else under the appropriate exemption. And a human reviews and attests. A.C.E. conversation logs routinely mix protected PII with public-business content — a constituent's finances, shared while asking for exemption advice. 'The AI applied the redaction' is not a defense in court. A person reviews. The reviewer's name goes in the log.",
  "B.6. Four triggers, any one of which means notify the Assessor or Deputy before responding. Paralegal content with potential attorney-client privilege. Anything from media, an oversight body, or relating to litigation. Records that would expose system prompts or configuration in a security-relevant way. Or anything triggering the 14-2-10 burdensome route. And — separate but related — if a search reveals A.C.E. is currently leaking PII in live conversations, that's an AIO05 incident on its own clock, run in parallel.",
  "B.7 and B.8. Produce or deny in writing, within fifteen calendar days. Permit inspection of the non-exempt records under Section 14-2-8. For anything withheld, the denial cites the specific statutory exemption under 14-2-11. Electronic copies are free; for physical copies you can charge a reasonable fee under 14-2-9(C). Then log the response — scope, records, redactions and their statutory basis, the reviewer who attested, the production or denial date, and any 14-2-10 extension. That log is itself a record.",
  "Quiz one. The custodian got an IPRA request on a Thursday. You, the AI Project Lead, saw it the following Monday. When does the three-business-day acknowledgment clock start? Thursday. The clock follows the custodian, not the AI Project Lead — and the requester never has to tell you why they want it.",
  "Quiz two. A conversation log responsive to a request contains a constituent's social security number inside a question. What do you do? Have a person redact the PPII under 14-2-6(F), have them attest to the redaction, and release the rest of the log under 14-2-9. Not withhold the whole thing — that's over-withholding. Not release the whole thing — that's a 14-2-6(F) violation. Not let the AI auto-redact — that's not a defense.",
  "Quiz three. A routine IPRA search turns up evidence that A.C.E. is actively leaking PII right now, in live conversations. Both SOPs apply. Run AIO05 in parallel — pause the agent, contain the live exposure, notify within the hour. AIO07 keeps running on its own clock. B.6 explicitly tells you to do this.",
  "Inventory. Archive. Acknowledge. Redact. Attest. Log. Part A keeps the office ready. Part B keeps the office on the clock. The custodian holds the keys. A human attests to every redaction. Nothing leaves the door without a written record. Count on us."
]
</script>
