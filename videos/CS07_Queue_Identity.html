[
  "Queue Identity and Administration. The rarely-touched, heavy-consequence side of queue management. Names, extensions, PINs, managers, direct phone numbers, voicemail. Touching these affects every member of the queue and every caller dialing in — get Deputy or Assessor sign-off before you start.",
  "Who can approve what. Different changes need different sign-offs. Group Name, Extension, PIN, SMS recipients — Deputy or Assessor only. Manager assignments — CSM with Deputy notify. Direct numbers and voicemail config — typically CSM, but coordinate with IT before changes.",
  "Four panel sections. The settings in this SOP live across four of the queue's six panel sections. Call Queue Details for identity. Permissions and Numbers for direct numbers. Messages and Notifications for voicemail. Outbound Calls and Faxes — rarely touched.",
  "General sub-tab — identity and admin. Ten fields. Most are display-only or rarely changed. Group Name, Extension, Email, Records Search permissions, Time Zone, and the queue's Manager assignment.",
  "Disable, don't delete. Two ways to take a queue out of service. Disabling preserves the queue and its history but stops it from receiving calls — reversible. Deleting is permanent and forfeits the history.",
  "Two manager roles. Click Edit next to Managers to assign. The Primary Manager has full control. Additional Managers can edit settings but not assign other managers. Both notify each other on incidents.",
  "Three identity fields you might actually touch. Group Name renames the queue — shows in caller ID and member-side displays. PIN is the four-digit code members use to log in. SMS recipients receive queue-related text alerts. All three require Deputy or Assessor authorization.",
  "Phone numbers assigned to the queue. Each row is a public number. Callers dialing this number reach the queue directly — without going through the auto-receptionist. Changes here can silently break public-facing phone numbers, so coordinate with IT.",
  "Pickup groups — rarely. Configures which other users can pick up a ringing call from this queue. Useful when members sit in proximity to one another. Modify only when a specific workflow change calls for it.",
  "Voicemail and Notifications. Configures the queue's voicemail greeting and who is notified when voicemails arrive. Voicemails are tracked in the Msg. column on the Call Queues list — that's how you know the configuration is correct.",
  "Ask first. The Advanced sub-tab holds advanced queue-level settings — number formatting, regional preferences. Modify only when a configuration change request explicitly requires it. Contact the RingCentral administrator group before any change here.",
  "Quiz one. A queue might be needed again someday. The right way to take it out of service is to disable it. Preserves history, fully reversible. Deleting is permanent.",
  "Quiz two. Group Name, PIN, and SMS recipients are Deputy or Assessor authorized. Identity changes ripple to every caller and every member.",
  "Rare changes. Heavy consequences. Snapshot the current state. Get approval. Save. Verify. Log. Identity changes ripple to every member and every caller. Count on us."
]
