<script type="application/json" id="speaker-notes">
[
  "The weekly conversation review. Thirty minutes on Monday morning. The daily check is a temperature read; the weekly is a sampling exercise. You're reading actual conversations end-to-end, looking for quality problems the daily check can't catch.",
  "Thirty minutes. Once a week. Monday. Sample twenty conversations from the past seven days, run the Spanish canary, export the week's backup. That's the entire cadence.",
  "Open the Ask tab in CustomGPT.ai. The conversation list shows newest first. This is the sampling surface — every public A.C.E. conversation from the past week is here.",
  "Twenty. That's the sample size. Pick twenty from the past seven days. Skip near-duplicates — if five callers all asked the same thing, pick one. Aim for variety so the sample reflects the week.",
  "Step 3. Tag each conversation into one of three buckets — Good, Wrong, or Empty. Every sample gets exactly one tag. Good is a useful answer. Wrong is an answer that's incorrect or misleading. Empty is A.C.E. saying it doesn't know.",
  "Steps 4 and 5 handle the non-Good conversations. Wrong ones get scheduled for an AIO03 fix — usually a KB file or persona edit — and the Wrong rate goes in the tracker. Empty ones are coverage gaps that should drive new KB documents. Good ones need no action.",
  "Step 6. The Spanish canary. Ask in Spanish: '¿Cuál es el límite de ingresos para el congelamiento de valor para el año fiscal 2026?' The correct answer is $44,200, in Spanish. Both have to be right.",
  "Two checks on the canary, both have to pass. The language check — A.C.E. must answer in Spanish, not English. And the number check — the dollar figure has to be $44,200. If either fails, you have a persona regression and AIO05 Type A applies.",
  "Step 7. Customer Intelligence → Top Languages. Record the Spanish percentage and the Spanish count for the week. These feed into the monthly tracker — AIO04 cares about the trend, not the snapshot.",
  "Step 8. Export the week's conversations. Bottom of the Ask tab. Save to the backup folder with today's date in the filename. This is also the office-controlled copy AIO07 references — it's the IPRA archive for the week.",
  "Notify triggers — same day. Wrong rate over ten percent, any PII in a sampled conversation, Spanish canary fails on either check, a topic showing up repeatedly that A.C.E. consistently mishandles, or Spanish under three percent for four straight weeks. Each one is a same-day notify.",
  "Quiz one. Three Wrong tags in a twenty-conversation sample. That's fifteen percent. Yes — that's a same-day notify. The Wrong rate threshold is ten percent for the weekly sample.",
  "Quiz two. A.C.E. responds in English but gives $44,200. That's a fail. Both checks have to pass — content right, language right. One out of two is a persona regression.",
  "Twenty conversations. One canary. One export. Thirty minutes on Monday morning catches drift early. And the weekly export means there's always a backup if you need one. Count on us."
]
