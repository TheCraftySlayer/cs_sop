<script type="application/json" id="speaker-notes">
[
  "The monthly metrics report. Thirty minutes on the first business day. It rolls up the daily and weekly signal into a tracker the Assessor and Deputy use for governance. AIO01 is a temperature check, AIO02 is a sample, and AIO04 is the executive view.",
  "Thirty minutes. Once a month. First business day. Always reporting on the prior calendar month. Three places to collect metrics from, one tracker row, one email summary.",
  "Three places. Same order, every month. All inside CustomGPT.ai → the A.C.E. agent. You'll pull from Analyze → Overview, then Customer Intelligence, then the main Dashboard.",
  "Step 1. Analyze → Overview. Top-of-funnel — total conversations, total queries, Content Source breakdown including the 'Not found' percentage. Four numbers go in the tracker.",
  "Step 2. Customer Intelligence. Quality and audience. Persona Failure rate, Risk Monitoring incident total, Top Languages including Spanish percent, and country breakdown.",
  "Step 3. Dashboard. Usage and capacity. Words Processed against the plan cap, success rate, and source geography. Four data points.",
  "Step 4. Update the tracker. Add a new row dated for the reporting month. The critical rule: compare against the prior month, not the prior day or week. Month-over-month is the only comparison that matters for governance.",
  "Step 5. Email summary. One paragraph. Same shape every month. Headline number, biggest change versus prior month, any threshold crossings, any planned follow-ups. Send to Assessor and Deputy. Subject starts with 'AIO04 / Month YYYY.'",
  "Flag thresholds. These apply to the monthly figure only. Daily and weekly snapshots crossing them is expected sample-size volatility — not a flag. The monthly is what counts.",
  "Six thresholds, any one is a flag. 'Not found' over fifteen percent. Persona Failure over fifteen percent. Spanish under three percent for two or more months. Success rate under ninety-seven percent. Plan cap reached persistently. And a single non-US country over fifteen percent — that usually means bot traffic and gets verified with IT.",
  "Quiz one. You see 'Not found' at twenty-two percent for one day. Do you flag it on the monthly tracker? No. Daily snapshots are volatile. The threshold applies to the monthly figure. One bad day isn't a flag.",
  "Quiz two. When updating the tracker, compare each metric against the prior month — not the prior day, not the prior week, not the year-ago figure. Month-over-month is the governance lens.",
  "Three sources. One tracker. One email. Thirty minutes on the first of the month keeps the office's AI governance posture documented and auditable. Count on us."
]
