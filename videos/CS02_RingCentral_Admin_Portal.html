[
  "The RingCentral Admin Portal. This is the entry point for every other phone SOP. CS03 through CS08 all start from here, so getting comfortable with sign-in, navigation, and the queue panel structure is the prerequisite. Spend ten minutes on this and the rest of the phone-system work becomes a step-by-step exercise.",
  "Four terms you'll hear in every other phone SOP. Admin Portal is the web interface at service.ringcentral.com. Queue is a group of phones that ring together. Extension is a unique number identifying a queue or user. Member is a person assigned to a queue.",
  "The four primary citizen-facing queues. Q1 is the switchboard — Assessor's Office, extension 160001. Q2 is Customer Service, 160002. Q3 and Q4 are division-specific. These four handle the front-line public.",
  "Plus more queues by division. Business and Personal Property, GIS, LEAP Division, Commercial and Non-Residential, Manufactured Homes, Residential variants. The full roster is at Phone System → Groups → Call Queues.",
  "Step 1. Open service.ringcentral.com. Type the URL directly or search for 'RingCentral Admin' and pick the service.ringcentral.com result. Bookmark it. You'll be back daily.",
  "Step 2. Sign in. County email, then your RingCentral password. Format is firstinitial plus lastname at bernco.gov. Forgot the password? The reset link goes to your county email.",
  "Step 3. Don't use SSO. Skip Google, Apple, and Microsoft SSO buttons unless IT specifically directed you to use them. RingCentral access uses your RingCentral password — not the same as your county Microsoft SSO.",
  "Step 4. Confirm you're in. The top-right should read Admin Portal. Three things to verify on the home page — the role label, the org name, and that Quick Access is visible.",
  "Step 5. Find a queue. Phone System → Groups → Call Queues. Or use the Quick Access shortcut on the home page. Every queue shows status, name, site, direct numbers, extension, voicemail count, and members availability.",
  "Step 6. Open the queue. Click the queue name and its configuration panel slides in on the right. The header shows the queue name and extension. Six expandable sections wait below.",
  "The six queue panel sections. Each maps to a different task SOP. Call Queue Details → CS07. Call Handling and Members → CS03 plus CS04. Greeting and Hold Music → CS06. Messages and Notifications → CS07. Outbound Calls and Faxes — rarely touched. Permissions and Numbers → CS07.",
  "Every change, every time. Four principles across all RingCentral queue edits. Snapshot the current state before you touch anything. Make one change at a time. Verify with a test call. Log it with timestamp, queue, change, and reason.",
  "Quiz one. The navigation path to open the call queue list is Phone System → Groups → Call Queues. Memorize it. You'll use it dozens of times a week.",
  "Quiz two. Extension 160001 is Q1 — the switchboard, first-touch queue. 160002 is Q2, Customer Service.",
  "You're in. Now you can edit. CS03 through CS08 all start from this screen. Bookmark service.ringcentral.com so you don't have to search again. Count on us."
]
