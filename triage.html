<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage · I got a call about… · BernCo Assessor SOPs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
  @font-face {
    font-family: 'Gotham Display';
    src: url('fonts/Gotham-Black.otf') format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bosque: #285952;
    --bosque-dark: #1d4640;
    --cypress: #013942;
    --terracotta: #e47756;
    --mist: #e8f1ee;
    --mist-soft: #f4f8f6;
    --paper: #faf8f4;
    --ink: #1a2620;
    --line: #cfd8d3;
    --muted: #5a6b65;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Montserrat", system-ui, sans-serif;
    color: var(--ink); background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  .top-bar {
    background: var(--paper); border-bottom: 2px solid var(--line);
    padding: 18px 56px; display: flex; align-items: center; gap: 28px;
    position: sticky; top: 0; z-index: 10;
  }
  .top-bar .crumb {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.6;
  }
  .top-bar .crumb b { color: var(--cypress); font-weight: 700; }
  .top-bar .back {
    margin-left: auto;
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--cypress); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; background: var(--paper);
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .top-bar .back:hover { border-color: var(--bosque); color: var(--bosque); background: var(--mist); }

  .hero {
    position: relative; overflow: hidden; background: var(--mist-soft);
    padding: 72px 56px 56px;
  }
  .hero::before { content: ''; position: absolute; right: -180px; top: -180px; width: 520px; height: 520px; border-radius: 50%; background: var(--bosque); opacity: 0.07; }
  .hero::after  { content: ''; position: absolute; right: 120px; bottom: -240px; width: 380px; height: 380px; border-radius: 50%; background: var(--terracotta); opacity: 0.09; }
  .hero .eyebrow {
    position: relative; font-size: 11px; font-weight: 700;
    color: var(--terracotta); letter-spacing: 0.22em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: clamp(40px, 6vw, 80px);
    font-weight: 900; line-height: 0.96; letter-spacing: -0.025em;
    text-transform: uppercase; color: var(--bosque);
    margin: 0; max-width: 1000px; position: relative; text-wrap: balance;
  }
  .hero h1 em { font-style: normal; color: var(--terracotta); }
  .hero p.lede {
    position: relative; font-size: 16px; color: var(--cypress);
    margin: 18px 0 0; max-width: 720px; line-height: 1.55;
  }

  /* ===== Wizard ===== */
  .wizard {
    padding: 48px 56px 80px;
    display: grid; grid-template-columns: 280px 1fr; gap: 48px;
    max-width: 1320px;
  }
  @media (max-width: 880px) { .wizard { grid-template-columns: 1fr; gap: 24px; padding: 32px 24px 64px; } }

  /* Path rail */
  .path {
    position: sticky; top: 90px; align-self: start;
    border-left: 2px solid var(--line); padding: 4px 0 4px 22px;
  }
  .path .label {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 14px;
  }
  .path ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .path li {
    position: relative; font-size: 13px; line-height: 1.4;
    color: var(--muted); padding-left: 4px;
  }
  .path li::before {
    content: ''; position: absolute; left: -29px; top: 5px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--line);
  }
  .path li.done { color: var(--cypress); }
  .path li.done::before { background: var(--bosque); border-color: var(--bosque); }
  .path li.now { color: var(--bosque); font-weight: 700; }
  .path li.now::before { background: var(--terracotta); border-color: var(--terracotta); box-shadow: 0 0 0 4px rgba(228,119,86,0.18); }
  .path li b { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .path li.done b, .path li.now b { color: var(--terracotta); }

  /* Stage */
  .stage { min-height: 480px; }
  .step { animation: fadein 220ms cubic-bezier(0.4,0,0.2,1); }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .step .q-eyebrow { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; }
  .step h2 {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: clamp(28px, 3.4vw, 44px);
    font-weight: 900; color: var(--cypress);
    text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.05;
    margin: 0 0 32px; max-width: 820px; text-wrap: balance;
  }
  .step h2 em { font-style: normal; color: var(--bosque); }

  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; max-width: 880px; }
  .opt {
    appearance: none; font-family: inherit; text-align: left; cursor: pointer;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 22px 24px; color: var(--ink);
    display: flex; flex-direction: column; gap: 6px; position: relative;
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .opt:hover { border-color: var(--bosque); background: var(--mist); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,30,27,0.08); }
  .opt:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }
  .opt .opt-label {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: 18px; font-weight: 900; color: var(--bosque);
    text-transform: uppercase; letter-spacing: -0.005em; line-height: 1.1;
  }
  .opt .opt-detail { font-size: 13px; color: var(--cypress); line-height: 1.45; }
  .opt .opt-arrow {
    position: absolute; top: 22px; right: 24px; color: var(--muted);
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .opt:hover .opt-arrow { color: var(--terracotta); transform: translateX(3px); }

  /* Back / restart row */
  .step .row {
    margin-top: 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .step .row button {
    appearance: none; font-family: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px;
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .step .row button:hover { color: var(--terracotta); border-color: var(--terracotta); }

  /* ===== Result card ===== */
  .result {
    background: var(--paper); border: 1.5px solid var(--bosque); border-radius: 14px;
    padding: 0; overflow: hidden; max-width: 880px;
    box-shadow: 0 24px 48px rgba(15,30,27,0.10);
    animation: pop 280ms cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.97) translateY(8px); } to { opacity: 1; transform: none; } }
  .result .res-head {
    background: var(--bosque); color: var(--paper);
    padding: 28px 32px; display: flex; align-items: center; gap: 22px;
    position: relative; overflow: hidden;
  }
  .result .res-head::after { content: ''; position: absolute; right: -100px; top: -100px; width: 240px; height: 240px; border-radius: 50%; background: var(--terracotta); opacity: 0.16; }
  .result .res-head .big-id {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: 72px; font-weight: 900; line-height: 0.85;
    color: var(--paper); letter-spacing: -0.04em; position: relative;
  }
  .result .res-head .big-id .small {
    display: block; font-size: 11px; font-weight: 700;
    letter-spacing: 0.28em; color: var(--terracotta); text-transform: uppercase;
    margin-bottom: 6px;
  }
  .result .res-head .res-title {
    flex: 1; position: relative;
  }
  .result .res-head .res-title h3 {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: 28px; font-weight: 900;
    color: var(--paper); text-transform: uppercase;
    letter-spacing: -0.005em; line-height: 1.05; margin: 0;
  }
  .result .res-head .res-title .meta {
    font-size: 12px; font-weight: 600; color: rgba(232,241,238,0.8);
    letter-spacing: 0.14em; text-transform: uppercase; margin-top: 8px;
  }
  .result .res-body { padding: 28px 32px 28px; }
  .result .res-body p.blurb { font-size: 16px; line-height: 1.55; color: var(--cypress); margin: 0 0 22px; max-width: 640px; text-wrap: pretty; }

  .result .actions {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .result .actions a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
    text-decoration: none; transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .result .actions a.primary { background: var(--terracotta); color: var(--paper); }
  .result .actions a.primary:hover { background: #c95f3f; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(228,119,86,0.36); }
  .result .actions a.secondary { background: transparent; color: var(--cypress); border: 1px solid var(--line); }
  .result .actions a.secondary:hover { border-color: var(--bosque); background: var(--mist); color: var(--bosque); }

  .result .also {
    margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line);
  }
  .result .also .lbl {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 12px;
  }
  .result .also .also-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .result .also .chip-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--mist-soft); color: var(--cypress);
    border: 1px solid var(--line); text-decoration: none;
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .result .also .chip-link:hover { background: var(--mist); border-color: var(--bosque); color: var(--bosque); }
  .result .also .chip-link b { color: var(--terracotta); font-weight: 700; letter-spacing: 0.08em; }

  .restart-row {
    margin-top: 24px; display: flex; gap: 12px;
  }
  .restart-row button {
    appearance: none; font-family: inherit; cursor: pointer;
    background: var(--cypress); color: var(--paper); border: 0;
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px;
    transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .restart-row button:hover { background: var(--bosque); }
  .restart-row .secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .restart-row .secondary:hover { color: var(--terracotta); border-color: var(--terracotta); background: transparent; }

  /* ===== Dead-end / escalate card ===== */
  .escalate {
    background: var(--cypress); color: var(--paper);
    border-radius: 14px; padding: 32px; max-width: 720px;
    box-shadow: 0 24px 48px rgba(1,57,66,0.18);
    animation: pop 280ms cubic-bezier(0.4,0,0.2,1);
  }
  .escalate .esc-eyebrow { font-size: 11px; font-weight: 700; color: var(--terracotta); letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 10px; }
  .escalate h3 {
    font-family: "Gotham Display", "Montserrat", sans-serif;
    font-size: 28px; font-weight: 900; color: var(--paper);
    text-transform: uppercase; margin: 0 0 14px; letter-spacing: -0.005em;
  }
  .escalate p { font-size: 15px; line-height: 1.6; color: rgba(232,241,238,0.88); margin: 0 0 18px; max-width: 600px; }
  .escalate a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--terracotta); color: var(--paper);
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none; transition: all 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .escalate a:hover { background: var(--paper); color: var(--cypress); }
</style>
</head>
<body>

<header class="top-bar">
  <div class="crumb"><b>Customer Service</b><br>Triage · I got a call about…</div>
  <a class="back" href="index.html">← All SOPs</a>
</header>

<section class="hero">
  <div class="eyebrow">Call-handling decision tree</div>
  <h1>I just got a call <em>about…</em></h1>
  <p class="lede">Answer one or two short questions and we'll route you to the right SOP. Faster than scanning titles, designed for the moment a caller is on hold.</p>
</section>

<section class="wizard">
  <aside class="path" aria-label="Your path">
    <div class="label">Your path</div>
    <ol id="path-list"></ol>
  </aside>

  <div class="stage" id="stage"></div>
</section>

<script src="lib/sop-data.js"></script>
<script>window.UTIL_PAGE = 'triage';</script>
<script src="lib/utility-nav.js"></script>
<script>
(function () {
  // All triage content lives in lib/sop-data.js — edit it there.
  const { SOPS, RELATED, TRIAGE: TREE, ESCALATIONS } = window.SOP_LIB;



  // ---- runtime ----
  let path = []; // [{nodeId, choiceIndex, label}]
  const stage = document.getElementById('stage');
  const pathListEl = document.getElementById('path-list');

  const arrowSVG = '<svg class="opt-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 14L14 4M14 4H7M14 4V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderPath(currentNodeId) {
    const items = [];
    path.forEach((p, i) => {
      items.push(`<li class="done"><b>Step ${i+1}</b>${p.label}</li>`);
    });
    const currentNode = TREE[currentNodeId];
    if (currentNode) {
      items.push(`<li class="now"><b>Step ${path.length+1}</b>${currentNode.eyebrow.replace(/^Step \d+ · /, '')}</li>`);
    }
    pathListEl.innerHTML = items.join('') || '<li class="now"><b>Step 1</b>What kind of call</li>';
  }

  function renderNode(id) {
    const node = TREE[id];
    if (!node) return;
    renderPath(id);
    stage.innerHTML = `
      <div class="step">
        <div class="q-eyebrow">${node.eyebrow}</div>
        <h2>${node.title}</h2>
        <div class="options">
          ${node.options.map((o, i) => `
            <button class="opt" data-i="${i}">
              ${arrowSVG}
              <div class="opt-label">${o.label}</div>
              <div class="opt-detail">${o.detail}</div>
            </button>
          `).join('')}
        </div>
        ${path.length ? `<div class="row"><button data-back>← Back</button><button data-restart>Start over</button></div>` : ''}
      </div>
    `;
    stage.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const opt = node.options[+btn.dataset.i];
        path.push({ nodeId: id, label: opt.label });
        if (opt.sop) renderSop(opt.sop);
        else if (opt.escalate) renderEscalate(opt.escalate);
        else if (opt.go) renderNode(opt.go);
      });
    });
    stage.querySelector('[data-back]')?.addEventListener('click', back);
    stage.querySelector('[data-restart]')?.addEventListener('click', restart);
  }

  function renderSop(sopId) {
    const sop = SOPS[sopId];
    if (!sop) return;
    renderPath(null);
    // mark all steps done
    pathListEl.innerHTML = path.map((p,i) => `<li class="done"><b>Step ${i+1}</b>${p.label}</li>`).join('')
      + `<li class="now"><b>Result</b>SOP ${sopId}</li>`;

    const related = (RELATED[sopId] || []).slice(0, 3)
      .map(r => SOPS[r.id] ? `<a class="chip-link" href="sops/${r.id}.html"><b>${r.id}</b> ${SOPS[r.id].title}</a>` : '')
      .join('');

    const isDoc = sop.docOnly;
    const watchHref = `videos/${sopId}_${slugForVideo(sopId)}.html`;
    const readHref = `sops/${sopId}.html`;

    stage.innerHTML = `
      <div class="result">
        <div class="res-head">
          <div class="big-id"><span class="small">SOP ${sopId}</span>${sopId.replace(/[A-Z]+/g,'').padStart(2,'0').slice(-2) || sopId}</div>
          <div class="res-title">
            <h3>${sop.title}</h3>
            <div class="meta">${sop.track} · ${sop.dur}</div>
          </div>
        </div>
        <div class="res-body">
          <p class="blurb">${sop.blurb}</p>
          <div class="actions">
            ${!isDoc ? `<a class="primary" href="${watchHref}">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>
              Watch the SOP
            </a>` : ''}
            <a class="${isDoc ? 'primary' : 'secondary'}" href="${readHref}">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 2h7v10H2zM9 2l3 1v8l-3 1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              Read the document
            </a>
          </div>
          ${related ? `
            <div class="also">
              <div class="lbl">You may also need</div>
              <div class="also-grid">${related}</div>
            </div>
          ` : ''}
        </div>
      </div>
      <div class="restart-row">
        <button data-restart>Triage another call</button>
        <button class="secondary" data-back>← One step back</button>
      </div>
    `;
    stage.querySelector('[data-back]')?.addEventListener('click', back);
    stage.querySelector('[data-restart]')?.addEventListener('click', restart);
  }

  function renderEscalate(key) {
    const esc = ESCALATIONS[key];
    if (!esc) return;
    pathListEl.innerHTML = path.map((p,i) => `<li class="done"><b>Step ${i+1}</b>${p.label}</li>`).join('')
      + `<li class="now"><b>Result</b>Escalation</li>`;
    stage.innerHTML = `
      <div class="escalate">
        <div class="esc-eyebrow">${esc.eyebrow}</div>
        <h3>${esc.h}</h3>
        <p>${esc.body}</p>
        <a href="${esc.cta.href}">${esc.cta.label} →</a>
      </div>
      <div class="restart-row">
        <button data-restart>Triage another call</button>
        <button class="secondary" data-back>← One step back</button>
      </div>
    `;
    stage.querySelector('[data-back]')?.addEventListener('click', back);
    stage.querySelector('[data-restart]')?.addEventListener('click', restart);
  }

  function back() {
    if (!path.length) return;
    const last = path.pop();
    renderNode(last.nodeId);
  }
  function restart() {
    path = [];
    renderNode('root');
  }

  // Map SOP id → video filename slug (matches your existing videos/ folder)
  function slugForVideo(id) {
    const map = {
      CS01: 'Veteran_Exemption',
      CS02: 'RingCentral_Admin_Portal',
      CS03: 'Queue_Member_Management',
      CS04: 'Queue_Routing',
      CS05: 'Holiday_and_Custom_Rules',
      CS06: 'Greeting_Music_Blocked',
      CS07: 'Queue_Identity',
      CS08: 'Custom_DID_Routing',
      CS09: 'Envoy_Export',
      CS10: 'Missing_AA_Record',
      CS11: 'Case_Entry_District_Court',
      AIO01: 'Daily_Check',
      AIO02: 'Weekly_Check',
      AIO03: 'Change_Management',
      AIO04: 'Monthly_Metrics',
      AIO05: 'Incident_Response'
    };
    return map[id] || '';
  }

  renderNode('root');
})();
</script>

</body>
</html>
